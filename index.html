<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kleine E-Autos 2026</title>
  <meta name="description" content="Vergleich kleiner E-Autos 2026">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="min-h-screen bg-gray-100 transition-colors dark:bg-gray-900">
<header class="bg-blue-600 py-6 text-white shadow-lg dark:bg-blue-800"><div class="mx-auto flex max-w-6xl items-center justify-between px-4"><div><h1 class="text-3xl font-bold">🚗⚡ Kleine E-Autos 2026</h1><p class="mt-1 text-blue-100">Das Erbe des legendären i10</p></div><button id="theme" type="button" class="rounded p-2 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-white" aria-label="Farbschema umschalten"><span id="theme-icon">🌙</span></button></div></header>
<main class="mx-auto max-w-6xl px-4 py-8">
<div class="mb-6 flex items-center gap-4"><label for="sort" class="font-medium dark:text-white">Sortieren:</label><select id="sort" class="rounded border px-3 py-2 dark:border-gray-600 dark:bg-gray-800 dark:text-white"><option value="preis">Preis (günstigste zuerst)</option><option value="reichweite">Reichweite (höchste zuerst)</option><option value="laenge">Länge (kleinste zuerst)</option></select></div>
<div id="cards" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" role="list"></div>
</main>
<div id="compare-bar" class="fixed bottom-0 left-0 right-0 hidden border-t bg-white p-4 shadow-lg dark:border-gray-700 dark:bg-gray-800" role="region" aria-label="Vergleichsauswahl"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4"><div id="selection" class="flex flex-wrap gap-2" aria-live="polite"></div><div class="flex gap-2"><button id="compare" type="button" class="rounded bg-blue-600 px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">Vergleichen</button><button id="clear" type="button" class="rounded bg-gray-300 px-4 py-2 dark:bg-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">Zurücksetzen</button></div></div></div>
<div id="modal" class="fixed inset-0 z-50 hidden overflow-auto bg-black/50" role="dialog" aria-modal="true" aria-labelledby="compare-title"><div class="mx-auto my-8 max-w-6xl rounded-lg bg-white shadow-xl dark:bg-gray-800 dark:text-white"><div class="flex items-center justify-between border-b p-4 dark:border-gray-700"><h2 id="compare-title" class="text-xl font-bold">Vergleich</h2><button id="close" type="button" class="rounded text-2xl text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Vergleich schließen">&times;</button></div><div id="compare-content" class="overflow-x-auto p-4"></div></div></div>
<script src="js/app.js"></script>
</body>
</html>
