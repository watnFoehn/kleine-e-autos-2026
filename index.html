<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kleine E-Autos 2026</title>
  <meta name="description" content="Vergleich kleiner E-Autos 2026">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="min-h-screen bg-gray-100 transition-colors dark:bg-gray-900">
<header class="bg-blue-600 py-6 text-white shadow-lg dark:bg-blue-800"><div class="mx-auto flex max-w-6xl items-center justify-between px-4"><div><h1 class="text-3xl font-bold">🚗⚡ Kleine E-Autos 2026</h1><p class="mt-1 text-blue-100">Das Erbe des legendären i10</p></div><button id="theme" type="button" class="rounded p-2 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-white" aria-label="Farbschema umschalten"><span id="theme-icon">🌙</span></button></div></header>
<main class="mx-auto max-w-6xl px-4 py-8">
<div class="mb-6 flex items-center gap-4"><label for="sort" class="font-medium dark:text-white">Sortieren:</label><select id="sort" class="rounded border px-3 py-2 dark:border-gray-600 dark:bg-gray-800 dark:text-white"><option value="preis">Preis (günstigste zuerst)</option><option value="reichweite">Reichweite (höchste zuerst)</option><option value="laenge">Länge (kleinste zuerst)</option></select></div>
<div id="cards" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" role="list"></div>
</main>
<div id="compare-bar" class="fixed bottom-0 left-0 right-0 hidden border-t bg-white p-4 shadow-lg dark:border-gray-700 dark:bg-gray-800" role="region" aria-label="Vergleichsauswahl"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4"><div id="selection" class="flex flex-wrap gap-2" aria-live="polite"></div><div class="flex gap-2"><button id="compare" type="button" class="rounded bg-blue-600 px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">Vergleichen</button><button id="clear" type="button" class="rounded bg-gray-300 px-4 py-2 dark:bg-gray-600 dark:text-white">Zurücksetzen</button></div></div></div>
<div id="modal" class="fixed inset-0 z-50 hidden overflow-auto bg-black/50" role="dialog" aria-modal="true" aria-labelledby="compare-title"><div class="mx-auto my-8 max-w-6xl rounded-lg bg-white shadow-xl dark:bg-gray-800 dark:text-white"><div class="flex items-center justify-between border-b p-4 dark:border-gray-700"><h2 id="compare-title" class="text-xl font-bold">Vergleich</h2><button id="close" type="button" class="rounded text-2xl text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Vergleich schließen">&times;</button></div><div id="compare-content" class="overflow-x-auto p-4"></div></div></div>
<script>
const vehicles=[
{name:'Dacia Spring',url:'https://www.dacia.de/modelle/spring-electric.html',preisUVP:16900,herstellerrabatt:5000,batterie:'26,8 kWh',reichweiteWLTP:225,reichweiteReal:'150–200 km',leistung:'33–48 kW (45–65 PS)',ladeleistungDC:'30 kW',laenge:3.7,breite:1.58,hoehe:1.52,kofferraum:308,sitze:'4',isofix:'hinten'},
{name:'Citroën ë-C3',url:'https://www.citroen.de/modelle/e-c3.html',preisUVP:20000,herstellerrabatt:5000,batterie:'44 kWh',reichweiteWLTP:320,reichweiteReal:'250–260 km',leistung:'83 kW (113 PS)',ladeleistungDC:'100 kW',laenge:4.02,breite:1.81,hoehe:1.58,kofferraum:310,sitze:'5',isofix:'2× hinten'},
{name:'Peugeot e-208',url:'https://www.peugeot.de/modelle/208.html',preisUVP:27000,herstellerrabatt:5000,batterie:'50 kWh',reichweiteWLTP:362,reichweiteReal:'250–300 km',leistung:'100 kW (136 PS)',ladeleistungDC:'100 kW',laenge:4.06,breite:1.75,hoehe:1.43,kofferraum:309,sitze:'5',isofix:'2× hinten'},
{name:'Opel Corsa-e',url:'https://www.opel.de/fahrzeuge/corsa.html',preisUVP:26000,herstellerrabatt:0,batterie:'50–51 kWh',reichweiteWLTP:390,reichweiteReal:'260–320 km',leistung:'100 kW (136 PS)',ladeleistungDC:'100 kW',laenge:4.06,breite:1.77,hoehe:1.43,kofferraum:309,sitze:'5',isofix:'2× hinten'},
{name:'Hyundai Inster',url:'https://www.hyundai.de/modelle/inster.html',preisUVP:24000,herstellerrabatt:0,batterie:'42–49 kWh',reichweiteWLTP:340,reichweiteReal:'250–310 km',leistung:'71–85 kW (97–115 PS)',ladeleistungDC:'85 kW',laenge:3.83,breite:1.61,hoehe:1.58,kofferraum:351,sitze:'4',isofix:'hinten'},
{name:'Hyundai Kona EV (39 kWh)',url:'https://www.hyundai.de/modelle/kona.html',preisUVP:17000,herstellerrabatt:null,gebraucht:true,batterie:'39 kWh',reichweiteWLTP:305,reichweiteReal:'250–300 km',leistung:'100 kW (136 PS)',ladeleistungDC:'50–100 kW',laenge:4.36,breite:1.83,hoehe:1.58,kofferraum:332,sitze:'5',isofix:'2× hinten'},
{name:'Hyundai Kona EV (65 kWh)',url:'https://www.hyundai.de/modelle/kona.html',preisUVP:20000,herstellerrabatt:null,gebraucht:true,batterie:'65 kWh',reichweiteWLTP:500,reichweiteReal:'350–420 km',leistung:'160 kW (218 PS)',ladeleistungDC:'100 kW',laenge:4.36,breite:1.83,hoehe:1.58,kofferraum:332,sitze:'5',isofix:'2× hinten'},
{name:'Fiat Grande Panda',url:'https://www.fiat.de/modelle/grande-panda',preisUVP:24900,herstellerrabatt:null,batterie:'44 kWh',reichweiteWLTP:320,reichweiteReal:'240–260 km',leistung:'83 kW (113 PS)',ladeleistungDC:'100 kW',laenge:4,breite:1.76,hoehe:1.57,kofferraum:310,sitze:'5',isofix:'2× hinten'},
{name:'Škoda Epiq',url:'https://www.skoda-auto.de/modelle/epiq/epiq',preisUVP:32100,herstellerrabatt:null,batterie:'52 kWh',reichweiteWLTP:440,reichweiteReal:'—',leistung:'155 kW (211 PS)',ladeleistungDC:'10–80 % in 24 min',laenge:4.17,breite:'—',hoehe:'—',kofferraum:475,sitze:'5',isofix:'2× hinten',comingSoon:true},
{name:'VW ID. Polo',url:'https://www.volkswagen.de/de/modelle/id-polo.html',preisUVP:24995,herstellerrabatt:null,batterie:'37–52 kWh',reichweiteWLTP:454,reichweiteReal:'—',leistung:'85–155 kW (116–211 PS)',ladeleistungDC:'bis 105 kW',laenge:4.053,breite:1.816,hoehe:1.53,kofferraum:441,sitze:'5',isofix:'—',comingSoon:true}];
let compareList=[];
const price=v=>v.herstellerrabatt?v.preisUVP-v.herstellerrabatt:v.preisUVP;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const sort=document.getElementById('sort').value;const sorted=[...vehicles].sort((a,b)=>sort==='preis'?price(a)-price(b):sort==='reichweite'?b.reichweiteWLTP-a.reichweiteWLTP:a.laenge-b.laenge);document.getElementById('cards').innerHTML=sorted.map(v=>`<article class="rounded-lg bg-white p-5 shadow dark:bg-gray-800" role="listitem"><div class="mb-4 flex h-40 items-center justify-center rounded bg-gray-100 dark:bg-gray-700"><span class="text-sm text-gray-500 dark:text-gray-400">Fahrzeugbild folgt</span></div><div class="mb-3 flex items-start justify-between gap-2"><h2 class="text-lg font-bold dark:text-white"><a href="${v.url}" target="_blank" rel="noopener noreferrer" class="rounded hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">${esc(v.name)}</a></h2>${v.gebraucht?'<span class="rounded bg-yellow-100 px-2 py-1 text-xs text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200">Gebraucht</span>':''}${v.comingSoon?'<span class="rounded bg-blue-100 px-2 py-1 text-xs text-blue-800 dark:bg-blue-900 dark:text-blue-200">Neu</span>':''}</div><div class="mb-1 text-2xl font-bold text-blue-600 dark:text-blue-400">${v.preisUVP.toLocaleString('de')} € <span class="text-sm font-normal text-gray-500">UVP</span></div>${v.herstellerrabatt?`<div class="text-sm text-gray-600 dark:text-gray-400">− ${v.herstellerrabatt.toLocaleString('de')} € Herstellerrabatt</div><div class="text-lg font-semibold text-green-600 dark:text-green-400">= ${price(v).toLocaleString('de')} € mit Rabatt</div>`:''}<dl class="mt-4 space-y-2 text-sm">${[['Reichweite WLTP',v.reichweiteWLTP+' km'],['Real',v.reichweiteReal],['Batterie',v.batterie],['Leistung',v.leistung],['DC-Laden',v.ladeleistungDC],['Maße',`${v.laenge}×${v.breite}×${v.hoehe} m`],['Kofferraum',v.kofferraum+' l'],['Sitze / ISOFIX',`${v.sitze} / ${v.isofix}`]].map(([a,b])=>`<div class="flex justify-between gap-4"><dt class="text-gray-600 dark:text-gray-400">${a}</dt><dd class="font-medium text-right dark:text-white">${b}</dd></div>`).join('')}</dl><button type="button" data-name="${esc(v.name)}" class="compare-btn mt-4 w-full rounded border py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 ${compareList.includes(v.name)?'bg-blue-600 text-white border-blue-600':'border-gray-300 dark:border-gray-600 dark:text-white'}" aria-pressed="${compareList.includes(v.name)}">${compareList.includes(v.name)?'✓ Im Vergleich':'+ Vergleichen'}</button></article>`).join('');document.querySelectorAll('.compare-btn').forEach(b=>b.addEventListener('click',()=>toggleCompare(b.dataset.name)));}
function toggleCompare(name){if(compareList.includes(name))compareList=compareList.filter(n=>n!==name);else if(compareList.length<3)compareList.push(name);updateBar();render();}
function updateBar(){const bar=document.getElementById('compare-bar');bar.classList.toggle('hidden',!compareList.length);document.getElementById('selection').innerHTML=compareList.map(n=>`<span class="rounded bg-blue-100 px-3 py-1 text-blue-800 dark:bg-blue-900 dark:text-blue-200">${esc(n)}</span>`).join('');}
function showCompare(){if(!compareList.length)return;const selected=vehicles.filter(v=>compareList.includes(v.name));const fields=[['UVP',v=>v.preisUVP.toLocaleString('de')+' €'],['Herstellerrabatt',v=>v.herstellerrabatt?'− '+v.herstellerrabatt.toLocaleString('de')+' €':'—'],['Mit Rabatt',v=>price(v).toLocaleString('de')+' €',v=>price(v),'low'],['Reichweite WLTP',v=>v.reichweiteWLTP+' km',v=>v.reichweiteWLTP,'high'],['Real',v=>v.reichweiteReal],['Batterie',v=>v.batterie],['Leistung',v=>v.leistung],['DC-Laden',v=>v.ladeleistungDC],['Länge',v=>v.laenge+' m',v=>v.laenge,'low'],['Breite',v=>v.breite+' m'],['Höhe',v=>v.hoehe+' m'],['Kofferraum',v=>v.kofferraum+' l',v=>v.kofferraum,'high'],['Sitze',v=>v.sitze],['ISOFIX',v=>v.isofix]];document.getElementById('compare-content').innerHTML=`<table class="w-full text-sm"><thead><tr class="border-b dark:border-gray-700"><th class="p-2 text-left"></th>${selected.map(v=>`<th class="p-2 text-left font-bold">${esc(v.name)}</th>`).join('')}</tr></thead><tbody>${fields.map(([label,display,get,best])=>{let classes=selected.map(()=> '');if(get&&best&&selected.length>1){const vals=selected.map(get),target=best==='high'?Math.max(...vals):Math.min(...vals);classes=vals.map(x=>x===target?'bg-green-100 dark:bg-green-900':'');}return `<tr class="border-b dark:border-gray-700"><td class="p-2 text-gray-600 dark:text-gray-400">${label}</td>${selected.map((v,i)=>`<td class="p-2 ${classes[i]}">${display(v)}</td>`).join('')}</tr>`;}).join('')}</tbody></table>`;document.getElementById('modal').classList.remove('hidden');document.getElementById('close').focus();}
function closeCompare(){document.getElementById('modal').classList.add('hidden');}
document.getElementById('sort').addEventListener('change',render);document.getElementById('compare').addEventListener('click',showCompare);document.getElementById('clear').addEventListener('click',()=>{compareList=[];updateBar();render();});document.getElementById('close').addEventListener('click',closeCompare);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').classList.contains('hidden'))closeCompare();});document.getElementById('theme').addEventListener('click',()=>{document.documentElement.classList.toggle('dark');const dark=document.documentElement.classList.contains('dark');localStorage.setItem('darkMode',dark);document.getElementById('theme-icon').textContent=dark?'☀️':'🌙';});if(localStorage.getItem('darkMode')==='true'){document.documentElement.classList.add('dark');document.getElementById('theme-icon').textContent='☀️';}render();
</script></body></html>
